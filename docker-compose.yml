services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ticket_triage_backend
    ports:
      - "8080:8080"
    volumes:
      # Mount the models locally to save Docker image space
      - ./app/artifacts:/code/app/artifacts:ro
    environment:
      # Pydantic Settings
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - CORS_ORIGINS=["http://localhost:7860", "http://127.0.0.1:7860"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ticket_triage_frontend
    ports:
      - "7860:7860"
    environment:
      # Point to the backend container internally via Docker network
      - API_BASE_URL=http://backend:8080/api/v1
    depends_on:
      - backend
